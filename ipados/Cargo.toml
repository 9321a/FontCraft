# FontCraft for iPadOS / iOS: the same code as the desktop app (../src), built for iPad and iPhone.
# Built with ../packaging/ipados/build-ipa.sh or in GitHub Actions.
[package]
name = "fontcraft-ipados"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "FontCraft"
path = "../src/main.rs"

[features]
default = ["net"]
net = ["dep:ureq"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
ttf-parser = "0.25"
ab_glyph = "0.2"
memmap2 = "0.9"
plist = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.49", default-features = false }
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
raw-window-handle = "0.6"
miniz_oxide = "0.9"
core-foundation = "0.10"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"], optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
