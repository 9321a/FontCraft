name: Compilar

# One universal installer per system, each with both processors inside; when installed it sees
# which one the computer has and installs that one:
#   macOS    FontCraft-<versión>-macOS.dmg            Apple Silicon and Intel in one app
#   Windows  FontCraft-<versión>-Windows-Setup.exe    x64 and ARM64 (and a portable .zip with both)
#   Linux    fontcraft_<versión>_all.deb              amd64 and arm64
#   Android  FontCraft-<versión>-Android.apk          ARM64 and x64
#   iPadOS   FontCraft-<versión>-iPadOS.ipa           iPad and iPhone (ARM64)
# Each installer is also tried: installed, checked that it chose the program of the computer's
# processor and that FontCraft starts, then removed. A tag like v0.2.0 also publishes the
# installers as a GitHub release, with SHA256SUMS.txt.

on:
  push:
  pull_request:
  # The "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer push stops the build still running for the same branch (it saves minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple Silicon e Intel) · .dmg
    # macos-latest: always a current Apple Silicon Mac (GitHub retires old macOS versions), which
    # also builds the Intel half.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Compilar la app universal y el .dmg
        run: bash packaging/macos/build-dmg.sh
      - name: Probar el .dmg
        env:
          CHECK_DMG_STRICT: "1"
        run: bash packaging/macos/check-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: FontCraft-macOS
          path: target/dist/*.dmg

  windows:
    name: Windows (x64 y ARM64) · instalador
    # Both on an x64 machine: Visual Studio there also builds for ARM64, so nothing waits for an
    # ARM computer.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Compilar para x64 y ARM64
        shell: bash
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          cargo build --release --target aarch64-pc-windows-msvc
      - name: Inno Setup
        # 6.3 or later: the first that knows ARM64 PCs. The installer script finds it in any
        # «Inno Setup…» folder and reads its version where Inno Setup's installer recorded it in
        # Windows (ISCC.exe itself says 0.0.0.0); if this step couldn't install it, the script
        # installs it itself. This lists what Windows has recorded, for the log.
        run: |
          choco upgrade innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { Write-Warning "Chocolatey no pudo instalar Inno Setup (código $LASTEXITCODE): lo instalará el script del instalador." }
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup*', 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup*', 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup*' -ErrorAction SilentlyContinue | ForEach-Object { "$($_.DisplayName) $($_.DisplayVersion) en $($_.InstallLocation)" }
          exit 0
      - name: Crear el instalador y la copia portátil
        run: ./packaging/windows/build-installer.ps1 -NoBuild
      - name: Probar el instalador
        run: ./packaging/windows/check-installer.ps1
      - uses: actions/upload-artifact@v6
        with:
          name: FontCraft-Windows
          path: |
            target/dist/*.exe
            target/dist/*.zip

  linux:
    name: Linux (x64 y ARM64) · .deb
    # Ubuntu 22.04, so the programs also run on older systems (glibc 2.35: Ubuntu 22.04, Debian 12
    # and later). Both programs are built here, the ARM64 one in a container of Ubuntu 22.04 with
    # ARM64's compiler and the GTK libraries FontCraft links (packaging/linux/Dockerfile), so
    # nothing waits for an ARM computer, which private repositories may not get.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Bibliotecas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Pruebas
        run: cargo test
      - name: Compilar los dos programas y el .deb
        run: bash packaging/linux/build-deb.sh
      - name: Probar la instalación en un PC (amd64)
        run: sudo bash packaging/linux/check-deb.sh
      - name: Emulador ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Probar la instalación en ARM64 (emulado)
        run: docker run --rm --platform linux/arm64 -v "$PWD:/w" -w /w ubuntu:22.04 bash -c "apt-get update -qq > /dev/null && bash packaging/linux/check-deb.sh"
      - uses: actions/upload-artifact@v6
        with:
          name: FontCraft-Linux
          path: target/dist/*.deb

  android:
    name: Android (ARM64 y x64) · .apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK y NDK de Android
        # The SDK comes installed on GitHub's Ubuntu machines (ANDROID_HOME); its own sdkmanager
        # adds what is missing.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" > /dev/null
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk
      - name: Clave de firma
        # A release APK must be signed. With the secrets ANDROID_KEYSTORE_BASE64 and
        # ANDROID_KEYSTORE_PASSWORD (a permanent key, needed for Google Play) it uses them; without
        # them the build script makes a test key.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            KS="$RUNNER_TEMP/fontcraft.keystore"
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
            echo "CARGO_APK_RELEASE_KEYSTORE=$KS" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Compilar el .apk
        run: |
          # ANDROID_HOME is set by GitHub's Ubuntu machine itself (it isn't in the workflow's env).
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.3.11579264"
          sh packaging/android/build-apk.sh
      - uses: actions/upload-artifact@v6
        with:
          name: FontCraft-Android
          path: target/dist/*.apk

  ipados:
    name: iPad y iPhone · .ipa
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ipados
      - name: Compilar el .ipa
        run: sh packaging/ipados/build-ipa.sh
      - uses: actions/upload-artifact@v6
        with:
          name: FontCraft-iPadOS
          path: |
            target/dist/*.ipa
            target/dist/*.mobileconfig

  publicar:
    name: Publicar la versión
    # Only for tags like v0.2.0 (GitHub Desktop: History, right-click a change, Create Tag…).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux, android, ipados]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Sumas de comprobación
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Crear la versión con los instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FontCraft ${GITHUB_REF_NAME#v}" --generate-notes
