[package]
name = "fontcraft"
version = "0.1.0"
edition = "2021"
description = "FontCraft: browse, preview, print and switch on fonts"

# The installers (one per system, each with both processors inside) are made by the scripts in
# packaging/ and by .github/workflows/build.yml; README.md, «Instaladores».
[[bin]]
name = "FontCraft"
path = "src/main.rs"

[features]
default = ["net"]
# Downloading Google Fonts. Always on in real builds.
net = ["dep:ureq"]

[dependencies]
eframe = "0.37"
ttf-parser = "0.25"
ab_glyph = "0.2"
memmap2 = "0.9"
plist = "1"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# FontCraft's icons are drawn from the SVG files in assets/icons/source.
resvg = { version = "0.49", default-features = false }
# Reading the fonts used in Office and OpenDocument files (Missing Fonts).
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
raw-window-handle = "0.6"
miniz_oxide = "0.9"

# Desktop only (Android and iOS have no desktop menu bar icon, global shortcut or trash).
[target.'cfg(all(not(target_os = "android"), not(target_os = "ios")))'.dependencies]
rfd = "0.18"
trash = "5"
tray-icon = "0.26"
global-hotkey = "0.10"

# Secure downloads (Google Fonts): the system's own TLS on macOS and Windows (no C toolchain needed to
# build for Windows), rustls on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
# GTK's print dialog (already used underneath by the file dialogs and the tray icon).
gtk = "0.18"
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 2

# Binaries to hand out: fully optimised, smaller, without debug symbols.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# The window library eframe uses (same version), for opening without taking focus (--screenshot).
winit = { version = "0.30", default-features = false }
core-foundation = "0.10"
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWindow", "NSPasteboard"] }

[target.'cfg(target_os = "ios")'.dependencies]
winit = { version = "0.30", default-features = false }
core-foundation = "0.10"
objc2 = { version = "0.6", features = ["exception"] }
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSGeometry"] }
